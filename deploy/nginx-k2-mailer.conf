# Обратный прокси nginx для K2 Mailer: терминирует HTTPS и проксирует на
# локальный порт приложения (127.0.0.1:8765).
#
# Установка:
#   sudo cp deploy/nginx-k2-mailer.conf /etc/nginx/sites-available/k2-mailer
#   sudo ln -s /etc/nginx/sites-available/k2-mailer /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: подставьте свой корпоративный сертификат, либо получите через
#   sudo certbot --nginx -d mailer.k2.cloud   (если доступен ACME во внутреннем контуре).

server {
    listen 80;
    server_name mailer.k2.cloud;   # ЗАМЕНИТЕ на ваше имя/адрес
    # Редирект на HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mailer.k2.cloud;   # ЗАМЕНИТЕ

    ssl_certificate     /etc/ssl/certs/k2-mailer.crt;   # ЗАМЕНИТЕ
    ssl_certificate_key /etc/ssl/private/k2-mailer.key;  # ЗАМЕНИТЕ
    ssl_protocols TLSv1.2 TLSv1.3;

    # Размер загружаемых файлов (Excel/PDF/фото)
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;   # рассылка может идти долго
    }

    # (необязательно) ограничить доступ только внутренней подсетью:
    # allow 10.0.0.0/8;  allow 192.168.0.0/16;  deny all;
}
