; Настройки подключения к рабочему Exchange (OWA, локальный/закрытый контур).
; Скопируйте этот файл в config.ini и заполните своими данными.
;   cp config.example.ini config.ini
;
; ВАЖНО: пароль здесь НЕ хранится. Скрипт спросит его при запуске
; или возьмёт из переменной окружения EWS_PASSWORD.

[exchange]
; Ваш рабочий адрес (он же отправитель писем).
email = ivanov@company.ru

; Логин для входа. Часто это DOMAIN\username или сам email.
; Если оставить пустым — будет использован email из строки выше.
username = COMPANY\ivanov

; Адрес EWS вашего сервера. Обычно это адрес OWA с хвостом /EWS/Exchange.asmx
; Например, если OWA открывается по https://mail.company.ru/owa,
; то EWS чаще всего: https://mail.company.ru/EWS/Exchange.asmx
; Если не знаете — оставьте пустым, скрипт попробует автоопределение (autodiscover).
ews_url = https://mail.company.ru/EWS/Exchange.asmx

; Тип аутентификации: NTLM (типично для локального Exchange), basic, или auto.
auth_type = NTLM

; Проверять SSL-сертификат сервера. Во внутренних сетях с самоподписанным
; сертификатом может потребоваться false (небезопасно, но иногда необходимо).
verify_ssl = true

[columns]
; Сопоставление полей с заголовками колонок в вашем Excel.
; Слева — внутреннее имя поля, справа — как колонка называется в файле.
name = Имя
company = Компания
email = Почта
subject = Тема письма
